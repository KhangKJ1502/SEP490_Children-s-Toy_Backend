version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: toystore-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=ToyStore@2024!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - toystore-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "ToyStore@2024!" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: toystore-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - toystore-network
    restart: unless-stopped

  # ToyStore API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toystore-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SEP490_ToyStore;User Id=sa;Password=ToyStore@2024!;TrustServerCertificate=True;
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - toystore-network
    restart: unless-stopped

  # ToyStore Worker (Background Jobs)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: toystore-worker
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SEP490_ToyStore;User Id=sa;Password=ToyStore@2024!;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
      api:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - toystore-network
    restart: unless-stopped

networks:
  toystore-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
