version: '3.8'

# Development environment with hot reload
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: toystore-db-dev
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=DevPassword123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_dev_data:/var/opt/mssql
    networks:
      - toystore-dev-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: toystore-redis-dev
    ports:
      - "6379:6379"
    networks:
      - toystore-dev-network

networks:
  toystore-dev-network:
    driver: bridge

volumes:
  sqlserver_dev_data:
    driver: local
